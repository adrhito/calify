  - separator [ref=f8e13]
  - paragraph [ref=f8e14]: CalifAI is a Chrome extension that uses AI to extract calendar event information from any webpage and adds it directly to your Google Calendar. Select any event text on screen, let AI read it, review the details, and add it to your calendar in seconds.
  - heading [level=2] [ref=f8e15]:
    - text: How It Works
    - link "Anchor" [ref=f8e16] [cursor=pointer]:
      - /url: "#how-it-works"
      - text: 
  - list [ref=f8e17]:
    - listitem [ref=f8e18]: Click the CalifAI icon in your Chrome toolbar
    - listitem [ref=f8e19]: Drag to select the area of the page containing the event
    - listitem [ref=f8e20]: AI extracts the title, date, time, location, and description
    - listitem [ref=f8e21]: Review and edit the details if needed
    - listitem [ref=f8e22]: Click Add — it’s in your Google Calendar
  - heading [level=2] [ref=f8e23]:
    - text: Features
    - link "Anchor" [ref=f8e24] [cursor=pointer]:
      - /url: "#features"
      - text: 
  - list [ref=f8e25]:
    - listitem [ref=f8e26]:
      - strong [ref=f8e27]: AI-powered extraction
      - text: — uses Gemini 2.5 Flash (free tier) or OpenAI
    - listitem [ref=f8e28]:
      - strong [ref=f8e29]: Multiple events at once
      - text: — capture a full schedule and choose which to add
    - listitem [ref=f8e30]:
      - strong [ref=f8e31]: Review before adding
      - text: — edit any field on a confirmation screen
    - listitem [ref=f8e32]:
      - strong [ref=f8e33]: Download .ics
      - text: — export to Apple Calendar, Outlook, or any other app
    - listitem [ref=f8e34]:
      - strong [ref=f8e35]: Shareable link
      - text: — copy a Google Calendar link to send to someone
    - listitem [ref=f8e36]:
      - strong [ref=f8e37]: Customizable theme
      - text: — adjust colors, time format, date format, and default event color
