  - paragraph [ref=f8e95]: The selected screenshot is sent to your chosen AI provider (Gemini or OpenAI) for event extraction only. Your Google Calendar access is handled directly through Google’s OAuth flow. No data passes through any CalifAI server — there isn’t one.
